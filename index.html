<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Tham khảo nghiên cứu khoa học</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=Pacifico&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ffe3ec; --bg2:#fff4e6; --ink:#6b2c46; --pink:#ff7aa8; --pink-d:#e0568a;
  --card:#fffafc; --fur:#ffd9a8; --fur-d:#f2b878; --line:#6b2c46; --b1:#ffc2d9; --b2:#ffe2b8; --b3:#e3d0ff;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#3a1c2b; --bg2:#2b1620; --ink:#ffd6e5; --pink:#ff8fb4; --pink-d:#ff6b9d;
    --card:#4a2538; --fur:#ffd9a8; --fur-d:#f2b878; --line:#2b1620; --b1:#7a2f55; --b2:#5a3a2a; --b3:#43306b;
  }
}
*{box-sizing:border-box}
html,body{min-height:100%;margin:0}
body{
  font-family:'Baloo 2',system-ui,sans-serif;color:var(--ink);display:flex;overflow-x:hidden;
  background:var(--bg);
}
.stage{width:min(92vw,460px);margin:auto;padding:12px 0 24px;text-align:center;position:relative;z-index:2}
h1{font-family:'Pacifico',cursive;font-weight:400;font-size:clamp(1.8rem,8vw,2.6rem);margin:0;color:var(--pink-d)}
.cat{width:min(52vw,210px);animation:bob 3s ease-in-out infinite}
.cat.pop{animation:pop .5s,bob 3s ease-in-out .5s infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
@keyframes pop{30%{transform:scale(1.15) rotate(-4deg)}60%{transform:scale(.95) rotate(3deg)}}
.tail{transform-origin:200px 250px;animation:wag 2s ease-in-out infinite}
@keyframes wag{50%{transform:rotate(14deg)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}
@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.f{display:none}
.cat[data-mood=happy] .happy,.cat[data-mood=love] .love,.cat[data-mood=smug] .smug,.cat[data-mood=sad] .sad,.cat[data-mood=cozy] .cozy,.cat[data-mood=ponder] .ponder{display:inline}
[hidden]{display:none!important}
.cat[data-mood=cozy],.cat.pop[data-mood=cozy]{animation:purr .7s ease-in-out infinite alternate}
@keyframes purr{from{transform:scale(1)}to{transform:scale(1.04,.96) translateY(3px)}}
.think{position:relative;margin:.9em auto 0;max-width:90%;padding:.6em 1em;background:var(--card);border:2px solid var(--pink);border-radius:30px;font-size:1.05rem;font-style:italic;animation:in .45s cubic-bezier(.3,1.6,.5,1)}
.think::before,.think::after{content:'';position:absolute;left:50%;background:var(--card);border:2px solid var(--pink);border-radius:50%}
.think::before{width:14px;height:14px;top:-22px;margin-left:-7px}
.think::after{width:8px;height:8px;top:-32px;margin-left:-4px}
.love .hh{transform-box:fill-box;transform-origin:center;animation:beat .8s infinite}
@keyframes beat{50%{transform:scale(1.25)}}
.tear{animation:tear 1.4s infinite}
@keyframes tear{0%{opacity:0;transform:translateY(-6px)}30%{opacity:1}100%{opacity:0;transform:translateY(26px)}}
.msg{
  margin:.6em auto 0;padding:1em 1.2em;background:var(--card);border-radius:24px;
  border:3px dashed var(--pink);font-size:1.2rem;line-height:1.5;
}
.msg.in{animation:in .45s cubic-bezier(.3,1.6,.5,1)}
@keyframes in{from{opacity:0;transform:scale(.7) translateY(16px)}}
.msg b{color:var(--pink-d)}
#act{display:flex;gap:.9rem;justify-content:center;flex-wrap:wrap;margin-top:1.1em}
button{
  font:700 1.05rem 'Baloo 2',sans-serif;color:#fff;background:var(--pink-d);
  border:0;border-radius:999px;padding:.6em 1.4em;cursor:pointer;
  box-shadow:0 6px 0 #b33a6a;transition:transform .15s,box-shadow .15s;
}
button.alt{background:#a98fa0;box-shadow:0 6px 0 #7d6475}
button:hover{transform:translateY(-2px)}
button:active{transform:translateY(5px);box-shadow:0 1px 0 #b33a6a}
button:focus-visible,input:focus-visible{outline:3px solid var(--ink);outline-offset:4px}
input{
  font:500 1.1rem 'Baloo 2',sans-serif;color:var(--ink);background:var(--card);
  border:3px solid var(--pink);border-radius:999px;padding:.55em 1.1em;width:min(100%,260px);text-align:center
}
.wish{margin:.5em 0 0;padding:.7em 1em;background:var(--card);border-radius:18px;border:2px solid var(--pink);animation:in .45s cubic-bezier(.3,1.6,.5,1)}
#extra{margin-top:.6em}
.bq{width:min(84vw,330px);display:block;margin:.8em auto 0}
.fl{cursor:pointer;transition:opacity .4s}
.fl.gone{opacity:0;pointer-events:none}
.fl:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.sw{transform-box:fill-box;transform-origin:center;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(7deg)}}
button.run{position:fixed;z-index:5;transition:left .25s ease,top .25s ease}
@media (prefers-reduced-motion:reduce){.sw,#bg i{animation:none}}
#bg{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden;contain:strict}
#bg i{position:absolute;width:70vmax;height:70vmax;border-radius:50%;opacity:.6;will-change:transform}
#bg i:nth-child(1){left:-25vmax;top:-25vmax;background:radial-gradient(circle,var(--b1),transparent 65%);animation:f1 26s ease-in-out infinite alternate}
#bg i:nth-child(2){right:-25vmax;bottom:-25vmax;background:radial-gradient(circle,var(--b2),transparent 65%);animation:f2 32s ease-in-out infinite alternate}
#bg i:nth-child(3){left:20vw;top:25vh;background:radial-gradient(circle,var(--b3),transparent 65%);animation:f1 22s ease-in-out -8s infinite alternate-reverse}
@keyframes f1{to{transform:translate(16vmax,10vmax) scale(1.12)}}
@keyframes f2{to{transform:translate(-14vmax,-12vmax) scale(1.1)}}
.d{will-change:transform}
#deco{position:fixed;inset:0;z-index:1;pointer-events:none;overflow:hidden}
.d{position:absolute;bottom:-40px;animation:rise linear forwards}
@keyframes rise{50%{transform:translate(24px,-58vh) rotate(20deg)}to{transform:translate(0,-115vh) rotate(40deg);opacity:.2}}
@media (prefers-reduced-motion:reduce){.cat,.tail,.eye,.tear,.hh{animation:none}}
</style>
</head>
<body>
<div id="bg" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="deco" aria-hidden="true"></div>
<main class="stage">
  <h1>20/10</h1>
  <svg class="cat" id="cat" data-mood="happy" viewBox="0 0 400 340" role="img" aria-label="Chú mèo D dễ thương">
    <g stroke="var(--line)" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
      <path class="tail" d="M290 260 C360 250 370 170 330 160" fill="none" stroke="var(--fur-d)" stroke-width="22"/>
      <ellipse cx="200" cy="270" rx="95" ry="58" fill="var(--fur)"/>
      <ellipse cx="160" cy="320" rx="22" ry="14" fill="#fff"/>
      <ellipse cx="240" cy="320" rx="22" ry="14" fill="#fff"/>
      <path d="M95 120 L105 40 L160 85 Z" fill="var(--fur)"/>
      <path d="M305 120 L295 40 L240 85 Z" fill="var(--fur)"/>
      <path d="M110 95 L113 62 L140 86 Z" fill="#ffb3c8" stroke="none"/>
      <path d="M290 95 L287 62 L260 86 Z" fill="#ffb3c8" stroke="none"/>
      <ellipse cx="200" cy="165" rx="115" ry="95" fill="var(--fur)"/>
      <path d="M185 78 Q200 98 215 78 M150 90 Q158 108 168 96 M250 90 Q242 108 232 96" fill="none" stroke="var(--fur-d)"/>
    </g>
    <ellipse cx="120" cy="195" rx="20" ry="12" fill="#ff9bb8" opacity=".7"/>
    <ellipse cx="280" cy="195" rx="20" ry="12" fill="#ff9bb8" opacity=".7"/>
    <g stroke="var(--line)" stroke-width="4" stroke-linecap="round" fill="none">
      <path d="M190 190 L210 190 L200 202 Z" fill="#ff7aa8" stroke-linejoin="round"/>
      <path d="M85 180 L45 172 M85 195 L42 198 M315 180 L355 172 M315 195 L358 198" stroke-width="3"/>
    </g>
    <g class="f happy">
      <ellipse class="eye" cx="150" cy="165" rx="12" ry="16" fill="#3b1a2a"/><ellipse class="eye" cx="250" cy="165" rx="12" ry="16" fill="#3b1a2a"/>
      <circle cx="154" cy="159" r="5" fill="#fff"/><circle cx="254" cy="159" r="5" fill="#fff"/>
      <path d="M200 202 Q190 220 175 210 M200 202 Q210 220 225 210" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g class="f love">
      <ellipse class="eye" cx="150" cy="165" rx="12" ry="16" fill="#3b1a2a"/><ellipse class="eye" cx="250" cy="165" rx="12" ry="16" fill="#3b1a2a"/>
      <circle cx="154" cy="159" r="5" fill="#fff"/><circle cx="254" cy="159" r="5" fill="#fff"/>
      <path d="M185 205 Q200 232 215 205 Z" fill="#ff7a8a" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/>
    </g>
    <g class="f ponder">
      <ellipse class="eye" cx="157" cy="160" rx="12" ry="16" fill="#3b1a2a"/><ellipse class="eye" cx="257" cy="160" rx="12" ry="16" fill="#3b1a2a"/>
      <circle cx="162" cy="153" r="5" fill="#fff"/><circle cx="262" cy="153" r="5" fill="#fff"/>
      <path d="M132 142 L166 146 M236 134 Q252 124 270 136 M190 212 Q200 205 210 212" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
    </g>
    <g class="f cozy" fill="none" stroke="var(--line)" stroke-width="5" stroke-linecap="round">
      <path d="M134 170 Q150 150 166 170 M234 170 Q250 150 266 170"/>
      <path d="M188 208 Q194 218 200 208 Q206 218 212 208" stroke-width="4"/>
    </g>
    <g class="f smug">
      <ellipse class="eye" cx="150" cy="168" rx="16" ry="20" fill="#3b1a2a"/><ellipse class="eye" cx="250" cy="168" rx="16" ry="20" fill="#3b1a2a"/>
      <circle cx="156" cy="160" r="7" fill="#fff"/><circle cx="256" cy="160" r="7" fill="#fff"/>
      <circle cx="144" cy="176" r="3.5" fill="#fff"/><circle cx="244" cy="176" r="3.5" fill="#fff"/>
      <path d="M130 148 L166 138 M270 148 L234 138" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <path d="M184 208 Q192 224 200 210 Q208 224 216 208" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      <ellipse cx="200" cy="222" rx="7" ry="6" fill="#ff7a8a"/>
      <path d="M92 128 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z M308 128 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3z" fill="#ffd54a"/>
    </g>
    <g class="f sad">
      <ellipse cx="150" cy="170" rx="12" ry="16" fill="#3b1a2a"/><ellipse cx="250" cy="170" rx="12" ry="16" fill="#3b1a2a"/>
      <circle cx="154" cy="164" r="6" fill="#fff"/><circle cx="254" cy="164" r="6" fill="#fff"/>
      <path d="M130 145 L168 156 M270 145 L232 156 M185 218 Q200 202 215 218" fill="none" stroke="var(--line)" stroke-width="4" stroke-linecap="round"/>
      <ellipse class="tear" cx="143" cy="190" rx="6" ry="9" fill="#7ec8ff"/>
      <ellipse class="tear" style="animation-delay:.7s" cx="257" cy="190" rx="6" ry="9" fill="#7ec8ff"/>
    </g>
    <g transform="translate(300 250) rotate(12)">
      <rect x="-3" y="0" width="6" height="55" fill="#6bbf6b" rx="3"/>
      <g fill="#ff7aa8" stroke="var(--line)" stroke-width="3">
        <circle cx="0" cy="-22" r="13"/><circle cx="21" cy="-7" r="13"/><circle cx="13" cy="17" r="13"/>
        <circle cx="-13" cy="17" r="13"/><circle cx="-21" cy="-7" r="13"/>
      </g>
      <circle r="10" fill="#ffd54a" stroke="var(--line)" stroke-width="3"/>
    </g>
  </svg>
  <div class="think" id="think" hidden></div>
  <p class="msg in" id="box" aria-live="polite"></p>
  <div id="act"></div>
  <div id="extra" aria-live="polite"></div>
</main>

<script>
const $=id=>document.getElementById(id);
const cat=$('cat'),box=$('box'),act=$('act'),extra=$('extra'),deco=$('deco');
const F=['🌸','🌷','🌼','🌹','💐'], H=['💖','💗','💕','🩷','❤️'], C=['🐱','🐾','🎀','⭐','🍓','☁️','🦋'];
const calm=matchMedia('(prefers-reduced-motion: reduce)').matches;
let name='';
const esc=s=>s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function drift(list,size){
  const s=document.createElement('span');
  s.className='d';s.textContent=list[Math.random()*list.length|0];
  s.style.left=Math.random()*96+'vw';
  s.style.fontSize=(size||1.2+Math.random()*1.2)+'rem';
  s.style.animationDuration=(7+Math.random()*6)+'s';
  deco.appendChild(s);setTimeout(()=>s.remove(),14000);
}
function burst(){} // đã tắt: bấm nút không thả thêm emoji
// nền sống động: luân phiên hoa ↔ hình dễ thương
let tick=0;
if(!calm)setInterval(()=>{if(!document.hidden&&deco.children.length<8)drift(Math.floor(tick++/6)%2?C:F)},1400);

function mood(m){$('think').hidden=true;cat.dataset.mood=m;cat.classList.remove('pop');void cat.offsetWidth;cat.classList.add('pop')}
function say(m,html){
  mood(m);box.innerHTML=html;box.classList.remove('in');void box.offsetWidth;box.classList.add('in');act.innerHTML='';
}
let busy=false;
function btn(label,fn,cls,nopause){
  const b=document.createElement('button');b.type='button';b.textContent=label;
  b.onclick=nopause?fn:()=>{
    if(busy)return;busy=true;
    mood('ponder');const t=$('think');t.textContent='💭 ...';t.hidden=false; // D suy nghĩ một lúc, biểu cảm đổi
    setTimeout(()=>{t.hidden=true;busy=false;fn()},1100);
  };
  if(cls)b.className=cls;act.appendChild(b);return b;
}

function start(){
  say('happy','Chào bạn! Mình là <b>D</b> 🐱<br>Cho D biết tên bạn nha?');
  const i=document.createElement('input');
  i.maxLength=20;i.placeholder='Nhập tên của bạn…';i.setAttribute('aria-label','Tên của bạn');
  act.appendChild(i);
  const go=()=>{const v=i.value.trim();if(!v){i.focus();return}name=v;greet()};
  i.onkeydown=e=>{if(e.key==='Enter')go()};
  btn('Bắt đầu 🐾',go);
}
function greet(){
  say('happy',`Xin chào <b>${esc(name)}</b> nhé, mình là <b>D</b> 🐱`);
  btn('Hello D 👋',()=>{mood('love');act.innerHTML='';btn('Tiếp tục ➡️',q2);burst(F)});
  btn('Kệ D 😒',()=>{say('sad','D sẽ buồn lắm 😿');btn('Tiếp tục ➡️',q2)},'alt');
}
function q2(){
  say('happy',`<b>${esc(name)}</b> thấy bản thân có xinh hog :3`);
  btn('Tất nhiên là xinh roi 😼',()=>{
    say('smug','Thế thì chúc người xinh đẹp như cậu ngày 20/10 thật ý nghĩa và trọn vẹn nhaaa 🌸');
    btn('Tiếp tục ➡️',wishes);burst(F);
  });
  btn('Hog tớ xấu lắm 😞',()=>{
    say('sad','Sai ròi cậu xinh lắm đó 🥺');
    btn('Nên là',()=>{
      say('love',`Chúc <b>${esc(name)}</b> có ngày 20/10 thật ý nghĩa và trọn vẹn nhaa 💖`);
      btn('Tiếp tục ➡️',wishes);burst(H);
    });
  },'alt');
}
const W=[
  ['love','Chúc cậu ngày phụ nữ Việt Nam thật rực rỡ'],
  ['happy','Không bao giờ phải rơi lệ vì những người tồi đã qua'],
  ['smug','Chúc cậu luôn giỏi hơn người mình ghét nét hơn người ghét mình nhé 😋']
];
const POS=[[90,85,'#ff7aa8'],[200,55,'#ffb347'],[310,85,'#b794f6']];
function flower(i){
  const [x,y,c]=POS[i];let p='';
  for(let k=0;k<6;k++){const a=k*Math.PI/3;p+=`<circle cx="${(Math.cos(a)*22).toFixed(1)}" cy="${(Math.sin(a)*22).toFixed(1)}" r="17" fill="${c}" stroke="var(--line)" stroke-width="3"/>`}
  return `<g class="fl" data-i="${i}" tabindex="0" role="button" aria-label="Bông hoa ${i+1}: bấm để mở lời chúc" transform="translate(${x} ${y})"><g class="sw" style="animation-delay:${i*.6}s">${p}<circle r="14" fill="#ffd54a" stroke="var(--line)" stroke-width="3"/></g></g>`;
}
const BOUQUET=`<svg class="bq" viewBox="0 0 400 310" role="group" aria-label="Bó hoa ba bông">
<g fill="none" stroke="#4aa24a" stroke-width="6" stroke-linecap="round"><path d="M90 105 Q120 175 195 228"/><path d="M200 78 V228"/><path d="M310 105 Q280 175 205 228"/></g>
<ellipse cx="140" cy="168" rx="26" ry="11" fill="#6bbf6b" transform="rotate(-35 140 168)"/><ellipse cx="260" cy="168" rx="26" ry="11" fill="#6bbf6b" transform="rotate(35 260 168)"/>
<path d="M120 195 L280 195 L215 296 Q200 303 185 296 Z" fill="#ffc2d6" stroke="var(--line)" stroke-width="4" stroke-linejoin="round"/>
<ellipse cx="184" cy="222" rx="16" ry="9" fill="#ff7aa8" stroke="var(--line)" stroke-width="3"/><ellipse cx="216" cy="222" rx="16" ry="9" fill="#ff7aa8" stroke="var(--line)" stroke-width="3"/><circle cx="200" cy="222" r="6" fill="#e0568a" stroke="var(--line)" stroke-width="3"/>
${[0,1,2].map(flower).join('')}</svg>`;

function wishes(){
  say('happy','Vài lời của D dành cho cậu nè 💌<br>Bấm vào từng bông hoa nhé 🌸');
  extra.innerHTML='<div id="bq">'+BOUQUET+'</div><div id="wl"></div>';
  let n=0;const bq=$('bq');
  const pick=f=>{
    if(!f||f.classList.contains('gone'))return;
    f.classList.add('gone');f.setAttribute('tabindex','-1');f.setAttribute('aria-hidden','true');
    const [m,t]=W[f.dataset.i];mood(m);
    const p=document.createElement('p');p.className='wish';p.textContent='• '+t;$('wl').appendChild(p);
    if(++n===W.length)btn('Tiếp tục ➡️',final);
  };
  bq.addEventListener('click',e=>pick(e.target.closest('.fl')));
  bq.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pick(e.target.closest('.fl'))}});
}
function dodge(e){
  if(e&&e.cancelable)e.preventDefault();
  if(!this._ph){const r=this.getBoundingClientRect(),ph=document.createElement('span');ph.style.cssText=`display:inline-block;width:${r.width}px;height:${r.height}px`;this.before(ph);this._ph=ph}
  this.classList.add('run');
  const w=innerWidth-this.offsetWidth-16,h=innerHeight-this.offsetHeight-16;
  this.style.left=(8+Math.random()*Math.max(w,0))+'px';
  this.style.top=(8+Math.random()*Math.max(h,0))+'px';
}
function final(){
  extra.innerHTML='';
  say('happy','20/10 vui vẻ nhaa 🌸');
  btn('Oke 👌',()=>{
    act.innerHTML='';mood('love');
    const t=$('think');t.textContent='💭 💗 💗 💗';t.hidden=false;
    const R=['Ưm~ thoải mái quá đi~~ 😌','Gãi thêm chỗ cằm nữa nha~~ gừ gừ…','Hôm nay D là mèo hạnh phúc nhất~~ 💭'];let k=0;
    btn('Nựng mèo con 🤗',()=>{
      mood('cozy');t.textContent='💭 '+R[k++%R.length];t.hidden=false;
      t.style.animation='none';void t.offsetWidth;t.style.animation='';
    },'',true);
  });
  const no=btn('Hong 🙅',()=>{},'alt',true);
  ['mouseenter','pointerdown','touchstart','focus','click'].forEach(ev=>no.addEventListener(ev,dodge));
}
start();
</script>
</body>
</html>
